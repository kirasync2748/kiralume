name: Package release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24 LTS)
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 (Node 24 LTS)
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify release tag and ancestry
        shell: bash
        run: |
          set -euo pipefail

          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]

          test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"

          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Check generated files
        run: npm run check:generated

      - name: Run tests
        run: npm test

      - name: Package extension
        run: npm run package

      - name: Run VS Code integration tests
        run: xvfb-run -a npm run test:integration

      - name: Publish to Visual Studio Marketplace
        run: npx vsce publish --packagePath dist/KiraLume.vsix --oidc

      - name: Generate release checksum
        working-directory: dist
        run: sha256sum KiraLume.vsix > SHA256SUMS.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node 24 LTS)
        with:
          name: kiralume-${{ github.ref_name }}
          path: |
            dist/KiraLume.vsix
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Create or update GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/release.mjs
