name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        vscode: ["1.96.0", stable]
        include:
          # Avoid the ARM64 pool while hosted runner capacity is constrained.
          - os: macos-latest
            runner: macos-26-intel
    runs-on: ${{ matrix.runner || matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24 LTS)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 (Node 24 LTS)
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run check:generated
      - run: npm test
      - run: npm run package
      - name: Run VS Code integration tests on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration
        env:
          VSCODE_VERSION: ${{ matrix.vscode }}
      - name: Run VS Code integration tests
        if: runner.os != 'Linux'
        run: npm run test:integration
        env:
          VSCODE_VERSION: ${{ matrix.vscode }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node 24 LTS)
        with:
          name: kiralume-${{ matrix.os }}-vscode-${{ matrix.vscode }}
          path: dist/KiraLume.vsix
          if-no-files-found: error
